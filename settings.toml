# Modify this file to update the global OocSimLodSettings



#########################################################################
############################# MISCELLANEOUS #############################
#########################################################################

### Measure the timings
# MEASURE_TIMINGS = true
MEASURE_TIMINGS = false

### Tells if need to find automatic properties
### When true, `init_default' (settings.cpp) derives the buffer sizes from the available memory:
###  - reduced to fit: MAX_NB_RENDERED_*, MAX_BATCHES_PER_OCTREE_UPDATE, MAX_NB_NODES_TO_EXCHANGE, VIS_RAM_CACHE_MAX_MB,
###    PREVIEW_POINTS_PER_REGION
###  - used as a floor: MAX_NB_NODES
###  - ignored (derived): LRU_UPDATES_CACHE_SIZE, NB_ALLOCABLE_*, MAX_NB_SPILLING_POINTS, MAX_NB_BACKLOG_VOXELS,
###    LRU_CPU_CACHE_SIZE
### See the AUTOMATIC SIZING section for its parameters; the resulting memory plan is printed with the settings
DERIVE_AUTOMATIC_PROPERTIES = true
# DERIVE_AUTOMATIC_PROPERTIES = false

### Tells if the point cloud filling network can be used
# IS_USING_NN = true
IS_USING_NN = false


#########################################################################
############################## BATCH SIZES ##############################
